# Saját projekt név, így a 3. heti konténerek mellett is futhat
name: recipe-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_starter
    ports:
      # A hoston 5433, hogy ne ütközzön egy másik helyi Postgres-szel
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_starter"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Compose-on belül az adatbázis host a szolgáltatás neve, nem localhost
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rag_starter
      # A mellette lévő .env fájlból
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
